name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Lint & Multi-Tenant Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_mt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize PostgreSQL app_user role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d saas_mt -f docker/init-db.sql

      - name: Run Database Migrations (RLS Setup)
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/saas_mt
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/saas_mt
          REDIS_URL: redis://localhost:6379
        run: npm run db:migrate

      - name: Typecheck & Build
        run: npm run build

      - name: Run Multi-Tenant Test Suite (RLS, Rate Limiter, Cache & Usage Isolation)
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/saas_mt
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/saas_mt
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test
